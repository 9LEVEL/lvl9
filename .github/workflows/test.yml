# shellcheck + instalação completa em containers limpos das 4 distros suportadas
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -S warning --shell=bash boot.sh install.sh bin/lvl9 lib/*.sh install/*.sh \
            tools/bump-versions.sh tests/*.sh config/bash/rc config/bash/prompt.bash \
            -e SC2034,SC2088,SC2164

  instalacao:
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        imagem: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Instala o lvl9 em ${{ matrix.imagem }}
        run: tests/docker.sh "${{ matrix.imagem }}"
      - name: Log
        if: always()
        run: cat tests/logs/*.log | tail -n 150
