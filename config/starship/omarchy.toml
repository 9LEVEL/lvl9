# Minimalista do Omarchy (akitaonrails/omarchy, config/starship.toml), 1 linha.
# Acréscimos: o host sempre e o usuário quando é root ou via SSH (padrão do módulo
# username), como "host ~/pasta ❯" ou "root@host ~/pasta ❯".
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 200
scan_timeout = 200   # pastas grandes ou disco lento (o padrão, 30ms, gera aviso no terminal)
format = "[$username$hostname$directory$git_branch$git_status]($style)$character"

[username]
style_root = "bold red"
format = "[$user@]($style)"

[hostname]
ssh_only = false
format = "[$hostname]($style) "

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
