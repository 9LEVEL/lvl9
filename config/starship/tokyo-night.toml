# Tokyo Night powerline em 2 linhas (base: preset "tokyo-night" do starship,
# paleta padrão do Omarchy).
# Linha 1: SO/usuário@host, pasta, git, linguagens  ·····  erro, duração, relógio
# Linha 2: ❯
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 500

format = """
[░▒▓](#a3aed2)\
$os\
$username\
$hostname\
[ ](bg:#a3aed2)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$python\
$nodejs\
$rust\
$golang\
$php\
[](fg:#212736)\
$fill\
$status\
$cmd_duration\
$jobs\
${env_var.LVL9_IP_LAN}\
${env_var.LVL9_IP_TS}\
[](fg:#1d2230)\
$time\
[▓▒░](#1d2230)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"

[os.symbols]
Debian = "󰣚"
Ubuntu = "󰕈"
Arch = "󰣇"
Linux = "󰌽"

[username]
show_always = true
style_user = "bg:#a3aed2 fg:#090c0c"
style_root = "bg:#a3aed2 fg:#c53b53 bold"
format = "[$user]($style)"

[hostname]
ssh_only = true
ssh_symbol = ""
style = "bg:#a3aed2 fg:#090c0c"
format = "[@$hostname $ssh_symbol]($style)"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
read_only = "󰌾 "
read_only_style = "fg:#c53b53 bg:#769ff0"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 Documentos"
"Downloads" = " Downloads"
"Imagens" = " Imagens"
"Músicas" = " Músicas"
"desenvolvimento" = "󰲋 desenvolvimento"

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[python]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version)( \($virtualenv\)) ](fg:#769ff0 bg:#212736)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[fill]
symbol = " "

# ── lado direito ──
[status]
disabled = false
format = '[](fg:#f7768e)[ ✘ $status ](bg:#f7768e fg:#1a1b26)'

[cmd_duration]
min_time = 2000
format = '[](fg:#e0af68)[ 󱎫 $duration ](bg:#e0af68 fg:#1a1b26)'

[jobs]
symbol = " "
format = '[](fg:#bb9af7)[ $symbol$number ](bg:#bb9af7 fg:#1a1b26)'

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"

# IPs (LAN da rota padrão + Tailscale), exportados pelo prompt.bash
[env_var.LVL9_IP_LAN]
format = '[](fg:#9ece6a)[ 󰩟 $env_value ](bg:#9ece6a fg:#1a1b26)'

[env_var.LVL9_IP_TS]
format = '[](fg:#7dcfff)[ 󰖂 $env_value ](bg:#7dcfff fg:#1a1b26)'
