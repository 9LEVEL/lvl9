# ~/.tmux.conf: tmux com tema Tokyo Night, mouse e área de transferência do sistema.
# Recarregar depois de editar: Ctrl+a e depois r

# ---------- básico ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # cores de 24 bits
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                 # fechou a janela 2, a 3 vira 2
setw -g automatic-rename on                # o nome da janela é o programa que está rodando
set -g automatic-rename-format "#{pane_current_command}"
set -g set-titles on
set -g set-titles-string "#S · #W"

# ---------- prefixo: Ctrl+a ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado"

# ---------- painéis e janelas ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Alt+1 a Alt+9: vai direto para a janela, sem prefixo
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------- área de transferência ----------
# Tudo o que o tmux copia (mouse ou teclado) vai para a área de transferência do X;
# no RDP ela é sincronizada com a do Windows (Ctrl+V lá).
set -s copy-command "xclip -selection clipboard -in"
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
# Ctrl+a e depois P: cola o que está na área de transferência do sistema
bind P run-shell "xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer"

# ---------- avisos: janela que tocou o sino (ex.: um Claude Code que terminou) ----------
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# ---------- tema Tokyo Night ----------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 90
set -g status-left "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #S#[fg=#7aa2f7,bg=default] "
set -g status-right "#{?client_prefix,#[fg=#e0af68#,bg=default]#[fg=#1a1b26#,bg=#e0af68#,bold] PREFIXO#[fg=#e0af68#,bg=default] ,}#{?pane_in_mode,#[fg=#9ece6a#,bg=default]#[fg=#1a1b26#,bg=#9ece6a#,bold]COPIANDO#[fg=#9ece6a#,bg=default] ,}#[fg=#7dcfff]󰒋 #H #[fg=#414868]│ #[fg=#c0caf5] %d/%m %H:%M "
setw -g window-status-separator " "
setw -g window-status-format "#{?window_bell_flag,#[fg=#e0af68]#[fg=#1a1b26#,bg=#e0af68#,bold]#I 󰂞 #W#[fg=#e0af68#,bg=default],#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_zoomed_flag, 󰁌,} }"
setw -g window-status-current-format "#[fg=#bb9af7,bg=default]#[fg=#1a1b26,bg=#bb9af7,bold]#I #W#{?window_zoomed_flag, 󰁌,}#[fg=#bb9af7,bg=default]"
setw -g window-status-bell-style "default"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]} #{pane_index} #{pane_current_command} #[fg=#565f89]#{b:pane_current_path} "
set -g message-style "fg=#1a1b26,bg=#7aa2f7,bold"
set -g message-command-style "fg=#1a1b26,bg=#7dcfff"
set -g mode-style "fg=#1a1b26,bg=#bb9af7"
set -g menu-style "fg=#c0caf5,bg=#1a1b26"
set -g menu-selected-style "fg=#1a1b26,bg=#7aa2f7"
set -g menu-border-style "fg=#7aa2f7"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
setw -g clock-mode-colour "#7aa2f7"
